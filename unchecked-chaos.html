    // Audio Player
    class AudioBufferPlayer {
        constructor() {
            if (this.audioContext && this.audioContext.state !== 'closed') {
                this.audioContext.close();
            }

            this.audioContext = new(parent.AudioContext || parent.webkitAudioContext)();
            this.source = null;
            this.buffer = null;

            this.gainNode = this.audioContext.createGain();
            this.gainNode.connect(this.audioContext.destination);
        }

        // Read base64
        async setBase64String(base64) {
            try {
                const binaryString = atob(base64.split(',')[1]);
                const bytes = Uint8Array.from(binaryString, c => c.charCodeAt(0));
                this.buffer = await this.audioContext.decodeAudioData(bytes.buffer);
                console.log("Audio decoded successfully");
            } catch (e) {
                console.error("DECODE ERROR:", e);
            }
        }

        _createSource() {
            if (this.source) {
                try {
                    this.source.stop();
                } catch {}
                this.source.disconnect();
            }
            this.source = this.audioContext.createBufferSource();
            this.source.buffer = this.buffer;
            this.source.loop = true;
            this.source.connect(this.gainNode);
        }

        play() {
            if (this.audioContext.state === "suspended") {
                this.audioContext.resume();
            }
            this._createSource();
            this.source.start(0);
        }

        pause() {
            if (this.source) {
                try {
                    this.source.stop();
                } catch {}
                this.source = null;
            }
        }

        setVolume(v) {
            this.gainNode.gain.value = v;
        }


    }

            //size

            this.h = h;

            //is the mouse on it?
            this.mouseOver = false;

            //hover time thing for animations
            this.time = 0;
          }

          hover() {
            //checks if the mouse is hovering on the button
            if (mouseOver(this.x, this.y, this.w, this.h)) {
              //if so update time
              this.time = lerp(this.time, 100, 0.1);
            cursor("pointer")

              //mouse is over
              this.mouseOver = true;
            } else {
              //reset time
              this.time = lerp(this.time, 0, 0.15);

              this.mouseOver = false;
            }

        class Timer {
          constructor() {
            this.startTime = performance.now();
            this.time = 0;

            this.started = !true;

            this.r = 0;
            this.s = 1;
            
            this.hiddenTimeStart = 0;
    this.timePauseOffset = 0; 
          }

          reset() {
            this.startTime = performance.now();
            this.time = 0;
            this.timePauseOffset = 0; 
            this.started = false;
          }

          draw() {
            
            ctx.fillStyle = "white";
            if(background.background[0] === "background5"){
            ctx.fillStyle = "black";
            }
            
            ctx.save();

            ctx.translate(10, 55);

            ctx.rotate(this.r);

            ctx.scale(this.s, this.s);

            ctx.font = "30px Audiowide";

            ctx.font = "Bold 30px Inconsolata";
            ctx.textAlign = "left";

            ctx.fillText("Score: " + this.time.toFixed(2), 0, 0);
            ctx.textAlign = "center";

            ctx.restore();
          }

          update() {
            if (moved && !this.started) {
              this.started = true;
              this.startTime = performance.now();
            } else if (!moved) {
              this.started = false;
            }
            if (this.started) {
              this.time = (performance.now() - this.startTime - this.timePauseOffset) / 1000;

              this.r = this.time % 1 < 0.5 ? Math.sin(this.time * (Math.PI * 2)) * 0.15 : 0;
              this.s = this.time % 1 < 0.5 ? 1 + Math.sin(this.time * (Math.PI * 2)) * 0.1 : 1;
            } else {
              this.time = 0;
              this.r = 0;
              this.s = 1;
              this.timePauseOffset =0
            }

            this.draw();
          }
        }

        }
      } else {
        if (timer.started && timer.hiddenTimeStart > 0) {
          timer.timePauseOffset += (performance.now() - timer.hiddenTimeStart);

              arc(0, 0, 300, 300, 0, (2 / Object.keys(imgs).length) * imgsLoaded);

                let curImg = imgs[Object.keys(imgs)[imgsLoaded]];

                Canvas.height = curImg.h;
                document.body.appendChild(Canvas);
                g = Canvas.getContext("2d");

                g.clearRect(0, 0, curImg.w, curImg.h);

                //draw of the current graphic
                curImg.draw();

                //take an image of it
                imgs[Object.keys(imgs)[imgsLoaded]] = Canvas;

                document.body.removeChild(Canvas);

                //to move on to the next one
                imgsLoaded++;

                //if all have been loaded move on to the next scene
